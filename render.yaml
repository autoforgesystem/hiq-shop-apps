# Render Blueprint for the HIQ Shop front-end (static site).
# In Render: New > Blueprint > pick this repository and the deploy/render branch.
# Spec: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: hiq-shop
    runtime: static
    branch: deploy/render
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # The API address including /api, e.g. https://hiq-shop-api.onrender.com/api.
      # Vite builds it into the site, so redeploy the site after changing it.
      - key: VITE_API_URL
        sync: false
      - key: NODE_VERSION
        value: "22"
    routes:
      # Single-page app: send every path that isn't a real file to index.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Built files have content hashes in their names, so they can be cached for a year
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
